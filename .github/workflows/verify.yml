name: Verify OpenDoc

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm package:pack --skip-build
      - name: Accept the installed release and updates
        run: |
          opendoc_version=$(node -p 'require("./package.json").version')
          node scripts/accept-package.mjs "output/packages/ryanyahya-opendoc-${opendoc_version}.tgz"
          node scripts/accept-update.mjs "output/packages/ryanyahya-opendoc-${opendoc_version}.tgz"
          node scripts/accept-package.mjs "output/packages/ryanyahya-opendoc-headless-${opendoc_version}.tgz"
          node scripts/accept-update.mjs "output/packages/ryanyahya-opendoc-headless-${opendoc_version}.tgz"
