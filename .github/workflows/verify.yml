name: Verify OpenDoc

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify source, build, and tests
        shell: bash
        run: |
          if pnpm verify 2>&1 | tee "$RUNNER_TEMP/opendoc-verify.log"; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const log = readFileSync(`${process.env.RUNNER_TEMP}/opendoc-verify.log`, 'utf8');
          const excerpt = log.split('\n').slice(-160).join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Verification failure\n\n\`\`\`text\n${excerpt}\n\`\`\`\n`);
          const failureStart = log.lastIndexOf('failing tests:');
          const details = (failureStart < 0 ? excerpt : log.slice(failureStart)).slice(-12000);
          for (let offset = 0; offset < details.length; offset += 3000) {
            const escaped = details.slice(offset, offset + 3000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Verification failure details ${offset / 3000 + 1}::${escaped}`);
          }
          NODE
          exit 1
      - run: pnpm package:pack --skip-build
      - name: Accept the installed release and updates
        run: |
          opendoc_version=$(node -p 'require("./package.json").version')
          node scripts/accept-package.mjs "output/packages/ryanyahya-opendoc-${opendoc_version}.tgz"
          node scripts/accept-update.mjs "output/packages/ryanyahya-opendoc-${opendoc_version}.tgz"
          node scripts/accept-package.mjs "output/packages/ryanyahya-opendoc-headless-${opendoc_version}.tgz"
          node scripts/accept-update.mjs "output/packages/ryanyahya-opendoc-headless-${opendoc_version}.tgz"
